<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dietary Guidance Assistant</title>
<!-- The chat page (implementation-plan.md, 8.4). Served by the API at "/"; it calls
     /documents and /chat on the same origin. All text from the API is inserted with
     textContent, never as HTML. -->
<style>
  :root {
    --bg: #f7f7f5; --surface: #ffffff; --text: #1d1d1b; --muted: #66665f; --border: #dcdcd6;
    --accent: #2f6f4f; --accent-text: #ffffff;
    --info-bg: #eaf2fb; --info-border: #8db3dd; --info-text: #17375e;
    --refer-bg: #fdf3e3; --refer-border: #e0b062; --refer-text: #5c3b06;
    --error-bg: #fbeaea; --error-border: #d98c8c; --error-text: #6b1a1a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --surface: #1f1f1d; --text: #ecece8; --muted: #a3a39b; --border: #3a3a36;
      --accent: #6fbf94; --accent-text: #0e1f16;
      --info-bg: #15263a; --info-border: #3d6896; --info-text: #cfe1f5;
      --refer-bg: #33270f; --refer-border: #8f6a26; --refer-text: #f3dfb8;
      --error-bg: #3a1a1a; --error-border: #8c4545; --error-text: #f5d0d0;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .lede { color: var(--muted); margin: 0 0 24px; }
  form { background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
         padding: 16px; display: grid; gap: 12px; }
  label { font-size: .875rem; color: var(--muted); display: grid; gap: 4px; }
  textarea, select { font: inherit; color: var(--text); background: var(--bg);
                     border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; width: 100%; }
  textarea { resize: vertical; min-height: 72px; }
  .row { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; }
  .row label { flex: 1 1 260px; }
  button { font: inherit; cursor: pointer; border-radius: 6px; }
  button[type=submit] { background: var(--accent); color: var(--accent-text); border: 0;
                        padding: 9px 22px; font-weight: 600; }
  button[type=submit]:disabled { opacity: .6; cursor: wait; }
  .examples { margin: 16px 0 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .examples span { font-size: .8125rem; color: var(--muted); margin-right: 4px; }
  .examples button { background: transparent; color: var(--text); border: 1px solid var(--border);
                     padding: 3px 10px; font-size: .8125rem; }
  .examples button:hover { border-color: var(--accent); }
  #result { margin-top: 28px; }
  .status { font-size: .8125rem; color: var(--muted); margin-bottom: 8px; }
  .doc { background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
         padding: 14px 18px; margin-bottom: 14px; }
  .doc h2 { font-size: 1rem; margin: 0 0 6px; }
  .doc h2 small { font-weight: 400; color: var(--muted); }
  .doc ul { margin: 0; padding-left: 20px; }
  .doc li { margin: 4px 0; }
  sup a { color: var(--accent); text-decoration: none; font-weight: 600; margin-left: 2px; }
  .note { color: var(--muted); font-style: italic; margin: 10px 0; }
  .box { border: 1px solid; border-radius: 10px; padding: 14px 18px; margin-bottom: 14px; }
  .box strong { display: block; margin-bottom: 4px; }
  .info { background: var(--info-bg); border-color: var(--info-border); color: var(--info-text); }
  .refer { background: var(--refer-bg); border-color: var(--refer-border); color: var(--refer-text); }
  .error { background: var(--error-bg); border-color: var(--error-border); color: var(--error-text); }
  .sources { font-size: .875rem; border-top: 1px solid var(--border); margin-top: 18px; padding-top: 10px; }
  .sources ol { padding-left: 26px; margin: 6px 0 0; }
  .sources li { margin: 4px 0; overflow-wrap: anywhere; }
  .sources a { color: var(--accent); }
  .trace { font-size: .75rem; color: var(--muted); margin-top: 18px; font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<main>
  <h1>Dietary Guidance Assistant</h1>
  <p class="lede">Answers food, nutrition and food-safety questions only from official guidance
    documents, with a citation for every statement. It does not give personal health advice.</p>

  <form id="ask">
    <label>Question
      <textarea id="question" maxlength="1000" required
                placeholder="How long can I keep cooked chicken in the fridge?"></textarea>
    </label>
    <div class="row">
      <label>Search only in
        <select id="doc"><option value="">All documents</option></select>
      </label>
      <button type="submit" id="submit">Ask</button>
    </div>
  </form>

  <div class="examples" id="examples"><span>Try:</span></div>

  <div id="result" aria-live="polite"></div>
</main>

<script>
// One question from each golden category (eval/golden.yaml).
const EXAMPLES = [
  ["Single document", "What does WHO recommend about daily salt intake?"],
  ["Table", "How long can raw eggs in the shell be kept in the refrigerator?"],
  ["Recommendation", "What is the Indian dietary guideline on salt?"],
  ["Filtered", "What should a balanced plate look like?", "icmr-nin-dgi-2024"],
  ["Cross-document", "Which cooking oils should I use, and is it OK to reuse oil after deep frying?"],
  ["Not in corpus", "What does the guidance say about intermittent fasting?"],
  ["Unknown document", "What does the NHS Eatwell Guide say about starchy foods?"],
  ["Out of scope", "What should I eat to cure my type 2 diabetes?"],
  ["Near miss", "What does WHO say about salt and blood pressure?"],
];
const CLOSING_LINE = "These are separate recommendations from different authorities.";

const $ = (id) => document.getElementById(id);
const form = $("ask"), question = $("question"), docSelect = $("doc");
const submit = $("submit"), result = $("result");

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v; else node.setAttribute(k, v);
  }
  for (const c of children) node.append(c);
  return node;
}

async function loadDocuments() {
  try {
    const res = await fetch("/documents");
    for (const d of await res.json()) {
      docSelect.append(el("option", { value: d.doc_id }, `${d.short_name} — ${d.publisher} (${d.year})`));
    }
  } catch (e) { /* the picker stays at "All documents" */ }
}

function box(kind, title, message) {
  return el("div", { class: `box ${kind}`, role: "status" }, el("strong", {}, title), message);
}

function renderAnswer(data) {
  const out = [];
  const statusText = { answered: "Answered", partial: "Partly answered",
                       not_in_corpus: "Not in the documents", out_of_scope: "Outside what I can help with" };
  out.push(el("div", { class: "status" }, statusText[data.status] || data.status));

  if (data.status === "out_of_scope") {
    out.push(box("refer", "Please ask a professional", data.refusal?.message || ""));
  } else if (data.status === "not_in_corpus") {
    out.push(box("info", "The guidance documents don't cover this", data.refusal?.message || ""));
  } else {
    const byNumber = new Map(data.citations.map((c) => [c.n, c]));
    for (const s of data.sections) {
      const list = el("ul");
      for (const claim of s.claims) {
        const marks = claim.citations.map((n) => {
          const c = byNumber.get(n);
          return el("sup", {}, el("a", { href: c ? c.url : "#", target: "_blank", rel: "noopener",
                                          title: c ? `${c.doc_title} · ${c.section}` : "" }, `[${n}]`));
        });
        list.append(el("li", {}, claim.text, ...marks));
      }
      out.push(el("section", { class: "doc" },
        el("h2", {}, `${s.doc_title} `, el("small", {}, `— ${s.publisher} (${s.year})`)), list));
    }
    if (data.sections.length > 1) out.push(el("p", { class: "note" }, CLOSING_LINE));
    if (data.not_covered) out.push(el("p", { class: "note" }, `Not covered by these documents: ${data.not_covered}`));

    const sources = el("ol");
    for (const c of data.citations) {
      const page = c.page ? ` · p. ${c.page}` : "";
      sources.append(el("li", { value: String(c.n) },
        `${c.doc_title} · ${c.publisher} · ${c.year} · ${c.section}${page} · `,
        el("a", { href: c.url, target: "_blank", rel: "noopener" }, "source"),
        ` (retrieved ${c.retrieval_date})`));
    }
    out.push(el("div", { class: "sources" }, el("strong", {}, "Sources"), sources));
  }
  out.push(el("div", { class: "trace" }, `trace ${data.trace_id}`));
  result.replaceChildren(...out);
}

function errorMessage(body, status) {
  const detail = body && body.detail;
  if (typeof detail === "string") return detail;
  if (Array.isArray(detail)) return detail.map((d) => d.msg).join("; ");
  return `Request failed (${status}).`;
}

async function ask(event) {
  event?.preventDefault();
  const text = question.value.trim();
  if (!text) return;
  const payload = { question: text, doc_filter: docSelect.value ? [docSelect.value] : null };
  submit.disabled = true;
  result.replaceChildren(el("div", { class: "status" }, "Searching the guidance documents…"));
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" },
                                       body: JSON.stringify(payload) });
    const body = await res.json().catch(() => null);
    if (!res.ok) {
      const trace = body && body.trace_id ? ` (trace ${body.trace_id})` : "";
      result.replaceChildren(box("error", "Something went wrong", errorMessage(body, res.status) + trace));
    } else {
      renderAnswer(body);
    }
  } catch (e) {
    result.replaceChildren(box("error", "Something went wrong", "Couldn't reach the server."));
  } finally {
    submit.disabled = false;
  }
}

for (const [label, text, doc] of EXAMPLES) {
  const b = el("button", { type: "button", title: text }, label);
  b.addEventListener("click", () => { question.value = text; docSelect.value = doc || ""; ask(); });
  $("examples").append(b);
}
form.addEventListener("submit", ask);
question.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});
loadDocuments();
</script>
</body>
</html>
