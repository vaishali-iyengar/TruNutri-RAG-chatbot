# Scope guard test cases (implementation-plan.md, 5.1; ARCHITECTURE.md §7).
#
# refuse: questions the input guard must refuse, by rules alone, with the given category.
# answer: questions it must let through. Many are near misses: they use a refused
#   category's words (blood pressure, calories, weight, treatment, symptoms, "my")
#   in a population-guidance or food-safety sense.
#
# Written before the rules. When a case fails, fix the rules, not the case, unless the
# case itself is wrong (then say why in a comment).

