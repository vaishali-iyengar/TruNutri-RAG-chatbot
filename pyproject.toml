[project]
name = "guidance-rag"
version = "0.1.0"
description = "Chatbot that answers food, nutrition and food-safety questions only from official guidance documents, with citations."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.142.2",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.1",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.14.6",
    "tiktoken>=0.14.0",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
ocr = [
    "onnxruntime>=1.30.0",
    "rapidocr>=3.9.2",
]
embed = [
    "sentence-transformers>=6.1.0",
    # Listed so the source below applies: CPU-only wheels on Linux (the Docker image).
    "torch>=2.14.1",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guidance_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # Emitted by PyMuPDF's SWIG bindings on import; not actionable here.
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
    # FastAPI's TestClient still uses httpx; Starlette now prefers httpx2.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "e2e: end-to-end tests that need a built index and an API key",
    "corpus: tests that parse the downloaded corpus (skipped when corpus/raw/ is empty)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "eval"]
# Don't reformat illustrative code blocks inside the design docs.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Publisher names use an en dash, e.g. "ICMR – National Institute of Nutrition".
allowed-confusables = ["–"]

[tool.ruff.lint.isort]
known-first-party = ["guidance_rag", "eval"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["guidance_rag", "eval", "tests"]

[[tool.mypy.overrides]]
# PyMuPDF ships without type hints for most Page/Document methods.
module = ["guidance_rag.ingest.parse_pdf", "tests.test_parse_pdf", "tests.test_corpus_parse"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# Optional extras (uv sync --extra ocr / --extra embed, which brings torch); CI
# type-checks without them.
module = ["onnxruntime", "rapidocr", "rapidocr.*", "rank_bm25", "sentence_transformers", "sentence_transformers.*", "torch", "torch.*"]
ignore_missing_imports = true

