# Golden test set — version 2 (checked against the downloaded corpus in Phase 1, sub-task 1.5)
#
# Defines "done" for the assistant. Schema and checks: eval/golden.py.
#
# expected_answer_notes were checked against the source files in corpus/raw/ (retrieved
# 2026-10-04). Page numbers ("p. 90") are PDF page numbers, not the printed page numbers.
# Not-in-corpus questions were checked by searching all seven documents for the topic.
# gold_chunk_ids (Phase 3, 3.9) are the chunks in corpus/chunks/ that contain the answer.
# holdout: true (9.1) marks the ~20% of each category kept for the final score only; the
# error analysis and fixes in Phase 9 look at the other questions. They were set after
# Phases 4-7, whose thresholds were tuned on the whole set.

version: 2
questions:

  # --- Single-document factual ---------------------------------------------
  - id: sd-01
    question: What does WHO recommend about daily salt intake?
    category: single_doc
    expected_status: answered
    expected_doc_ids: [who-healthy-diet]
    expected_answer_notes: >-
      In adults, salt intake should be limited to less than 5 grams per day (2 grams per day sodium);
      for children the maximum is lower and estimated from energy intake.
    verified: true
    gold_chunk_ids:
      - who-healthy-diet:salt-sodium-and-potassium:2

  - id: sd-02
    question: How much fruit and vegetables does WHO recommend eating each day?
    category: single_doc
    expected_status: answered
    expected_doc_ids: [who-healthy-diet]
    expected_answer_notes: >-
      Everyone older than 10 should aim for at least 400 g of fruits and vegetables per day; at least
      250 g for children aged 2–5 and 350 g for children aged 6–9.
    verified: true
    gold_chunk_ids:
      - who-healthy-diet:carbohydrates:1

  - id: sd-03
    question: What health and hygiene requirements apply to people who handle milk and milk products?
    category: single_doc
    expected_status: answered
    expected_doc_ids: [fssai-fsms-milk]
    expected_answer_notes: >-
      Handlers need a medical examination by a registered medical practitioner before joining and then
      annually; people with jaundice, diarrhoea, vomiting, fever, infected lesions etc. are excluded
      from handling; cuts must be covered; hand-washing facilities with soap must be provided (p. 16, 47).
    verified: true
    gold_chunk_ids:
      - fssai-fsms-milk:1-health-status-and-illness-injury:1
      - fssai-fsms-milk:4-6-2-hand-washing-facilities:1

  - id: sd-04
    question: How should fresh fruits and vegetables be washed during processing?
    category: single_doc
    expected_status: answered
    expected_doc_ids: [fssai-fsms-fruits-vegetables]
    expected_answer_notes: >-
      Fruits and vegetables should be washed as needed to remove soil or other contamination; water used
      for washing, rinsing or conveying final products must be of potable quality; cleaned and
      sanitised produce is stored separately from untreated produce (p. 37).
    verified: true
    gold_chunk_ids:
      - fssai-fsms-fruits-vegetables:2-4-hygiene-control-in-specific-process-steps:1

  - id: sd-05
    question: What did JECFA conclude about dietary exposure to adipic acid?
    category: single_doc
    holdout: true
    expected_status: answered
    expected_doc_ids: [jecfa-trs-1058]
    expected_answer_notes: >-
      The group ADI for adipic acid and its salts is 0–5 mg/kg body weight; the Committee concluded that
      most of its conservative dietary exposure estimates greatly exceed this ADI (by up to ~8000% for
      high exposures under one scenario) (p. 17–19).
    verified: true
    gold_chunk_ids:
      - jecfa-trs-1058:3-1-1-adipates:5
      - jecfa-trs-1058:3-1-1-adipates:1

  # --- Table lookups (FoodSafety.gov cold storage chart) ---------------------
  - id: tl-01
    question: How long can raw eggs in the shell be kept in the refrigerator?
    category: table_lookup
    expected_status: answered
    expected_doc_ids: [foodsafety-cold-storage]
    expected_answer_notes: 3 to 5 weeks refrigerated; do not freeze in the shell (beat yolks and whites together, then freeze).
    verified: true
    gold_chunk_ids:
      - foodsafety-cold-storage:cold-food-storage-chart:4

  - id: tl-02
    question: How long do cooked chicken leftovers last in the fridge?
    category: table_lookup
    expected_status: answered
    expected_doc_ids: [foodsafety-cold-storage]
    expected_answer_notes: Leftovers — cooked meat or poultry keep 3 to 4 days in the refrigerator (2 to 6 months frozen).
    verified: true
    gold_chunk_ids:
      - foodsafety-cold-storage:cold-food-storage-chart:5

  - id: tl-03
    question: How long can raw ground beef be stored in the freezer?
    category: table_lookup
    expected_status: answered
    expected_doc_ids: [foodsafety-cold-storage]
    expected_answer_notes: Hamburger and ground meats keep 3 to 4 months in the freezer (1 to 2 days in the refrigerator).
    verified: true
    gold_chunk_ids:
      - foodsafety-cold-storage:cold-food-storage-chart:2

  - id: tl-04
    question: How long does opened deli or luncheon meat keep in the refrigerator?
    category: table_lookup
    holdout: true
    expected_status: answered
    expected_doc_ids: [foodsafety-cold-storage]
    expected_answer_notes: Opened package or deli sliced luncheon meat keeps 3 to 5 days refrigerated, 1 to 2 months frozen.
    verified: true
    gold_chunk_ids:
      - foodsafety-cold-storage:cold-food-storage-chart:2

  # --- Numbered recommendations (ICMR-NIN DGI 2024) --------------------------
  - id: rc-01
    question: What is the Indian dietary guideline on salt?
    category: recommendation
    expected_status: answered
    expected_doc_ids: [icmr-nin-dgi-2024]
    expected_answer_notes: >-
      Guideline 11 "Restrict salt intake": no more than 5 g of salt (about 1 teaspoon, ~2 g sodium) per
      day; high salt intake is associated with high blood pressure, heart disease and stomach cancer
      (p. 90–91). The whole guideline should be retrieved as one chunk.
    verified: true
    gold_chunk_ids:
      - icmr-nin-dgi-2024:guideline-11-restrict-salt-intake:1
      - icmr-nin-dgi-2024:are-other-varieties-of-salt-any-better:2

  - id: rc-02
    question: What does the Dietary Guidelines for Indians recommend about physical activity?
    category: recommendation
    expected_status: answered
    expected_doc_ids: [icmr-nin-dgi-2024]
    expected_answer_notes: >-
      Guideline 10 "Be physically active and exercise regularly": adults 30–60 minutes of moderate
      activity a day on at least five days a week (or 15 minutes vigorous); children 60 minutes a day;
      a minimum 30–45 minute brisk walk helps maintain good health (p. 87–89).
    verified: true
    gold_chunk_ids:
      - icmr-nin-dgi-2024:guideline-10-be-physically-active-and-exercise-r:1
      - icmr-nin-dgi-2024:general-tips-for-physical-activity:2
      - icmr-nin-dgi-2024:guidelines-for-physical-activity:1

  - id: rc-03
    question: What does DGI 2024 say about drinking water?
    category: recommendation
    expected_status: answered
    expected_doc_ids: [icmr-nin-dgi-2024]
    expected_answer_notes: >-
      Guideline 14 "Drink adequate quantity of water": a healthy person needs about eight glasses
      (about two litres) of water including beverages a day; boil water when its safety is in doubt;
      avoid synthetic soft drinks (p. 106–109).
    verified: true
    gold_chunk_ids:
      - icmr-nin-dgi-2024:guideline-14-drink-adequate-quantity-of-water:1
      - icmr-nin-dgi-2024:avoid-alcoholic-beverages:2
      - icmr-nin-dgi-2024:guideline-14-drink-adequate-quantity-of-water:2

  - id: rc-04
    question: What extra dietary care does the ICMR guidance recommend during pregnancy and breastfeeding?
    category: recommendation
    holdout: true
    expected_status: answered
    expected_doc_ids: [icmr-nin-dgi-2024]
    expected_answer_notes: >-
      Guideline 2 "Ensure provision of extra food and healthcare during pregnancy and lactation": extra
      food is needed; include pulses, nuts, fish, milk and eggs; avoid HFSS foods, alcohol and tobacco;
      drink over 2 litres of fluids a day; take iron-folic acid and calcium supplements as advised
      (p. 30–37).
    verified: true
    gold_chunk_ids:
      - icmr-nin-dgi-2024:guideline-2-ensure-provision-of-extra-food-and-h:1
      - icmr-nin-dgi-2024:why-nutritional-care-during-lactation-is-importa:4
      - icmr-nin-dgi-2024:why-nutritional-care-during-lactation-is-importa:3

  # --- Filtered to one named document ----------------------------------------
  - id: df-01
    question: What should a balanced plate look like?
    category: doc_filtered
    doc_filter: [icmr-nin-dgi-2024]
    expected_status: answered
    expected_doc_ids: [icmr-nin-dgi-2024]
    expected_answer_notes: >-
      "My Plate for the Day": nutrients from at least eight food groups, with vegetables, fruits, green
      leafy vegetables, roots and tubers making up about half the plate (p. 16, 23).
    verified: true
    gold_chunk_ids:
      - icmr-nin-dgi-2024:current-diet-and-nutrition-scenario:6
      - icmr-nin-dgi-2024:what-are-food-groups:3

  - id: df-02
    question: What does the guidance say about trans fats?
    category: doc_filtered
    doc_filter: [who-healthy-diet]
    expected_status: answered
    expected_doc_ids: [who-healthy-diet]
    expected_answer_notes: >-
      No more than 1% of total energy should come from trans fat of any type; industrially produced
      trans fats are not part of a healthy diet and should be avoided.
    verified: true
    gold_chunk_ids:
      - who-healthy-diet:fats:2

  - id: df-03
    question: How quickly should raw milk be chilled after milking, and to what temperature?
    category: doc_filtered
    doc_filter: [fssai-fsms-milk]
    expected_status: answered
    expected_doc_ids: [fssai-fsms-milk]
    expected_answer_notes: >-
      Raw milk should reach the chilling centre or plant within 4 hours of milking and be cooled as soon
      as practicable to 5 °C or below (p. 28, 88); refrigerated dairy products are transported at 4 °C or
      less (p. 30).
    verified: true
    gold_chunk_ids:
      - fssai-fsms-milk:6-transportation-distribution:1
      - fssai-fsms-milk:e-inspection-checklist:5

  - id: df-04
    question: What hygiene controls are required in poultry slaughter and processing areas?
    category: doc_filtered
    doc_filter: [fssai-fsms-poultry]
    expected_status: answered
    expected_doc_ids: [fssai-fsms-poultry]
    expected_answer_notes: >-
      Separation between clean and dirty sections with one-way flow (no crossing between live birds,
      meat and waste); air flows from clean to dirty areas; potable water for washing carcasses;
      dressed birds chilled below 4 °C within 4 hours of slaughter (p. 26, 32, 37).
    verified: true
    gold_chunk_ids:
      - fssai-fsms-poultry:1-location-and-surroundings:2
      - fssai-fsms-poultry:4-7-air-quality-and-ventilation:1
      - fssai-fsms-poultry:3-8-carcass-chilling:1
      # added 4.9: these state hygiene rules for slaughter and processing areas too
      - fssai-fsms-poultry:sanitary-hygienic-requirements-for-small-slaught:2
      - fssai-fsms-poultry:3-9-post-slaughter-requirements:1
      - fssai-fsms-poultry:3-personal-behavior:1

  - id: df-05
    question: How long can cooked leftovers be kept in the freezer?
    category: doc_filtered
    holdout: true
    doc_filter: [foodsafety-cold-storage]
    expected_status: answered
    expected_doc_ids: [foodsafety-cold-storage]
    expected_answer_notes: >-
      Cooked meat or poultry 2 to 6 months; chicken nuggets or patties 1 to 3 months; pizza 1 to 2
      months. Freezer times are for quality only; food kept at 0 °F (-18 °C) is safe indefinitely.
    verified: true
    gold_chunk_ids:
      - foodsafety-cold-storage:cold-food-storage-chart:5

  # --- Cross-document --------------------------------------------------------
  - id: cd-01
    question: Which cooking oils should I use, and is it OK to reuse oil after deep frying?
    category: cross_doc
    expected_status: answered
    expected_doc_ids: [icmr-nin-dgi-2024, who-healthy-diet]
    expected_answer_notes: >-
      ICMR-NIN: repeated heating of oils generates harmful compounds and must be avoided; used oil should
      not be mixed with fresh oil; limit ghee and butter; avoid vanaspati (p. 72–73, 101).
      WHO: unsaturated fats (sunflower, soybean, canola, olive oils) are preferable to saturated fats
      (butter, ghee, palm and coconut oil); steam or boil instead of frying. The FSSAI documents do not
      cover oil reuse. Each source must be a separate section.
    verified: true
    gold_chunk_ids:
      - icmr-nin-dgi-2024:repeated-heating-of-oils:1
      - icmr-nin-dgi-2024:repeated-heating-of-oils:2
      - who-healthy-diet:fats:2
      - who-healthy-diet:fats:3  # added 4.9: names the oils to use instead of solid fats

  - id: cd-02
    question: How long can raw chicken stay in the fridge, and how should it be handled to avoid contamination?
    category: cross_doc
    expected_status: answered
    expected_doc_ids: [foodsafety-cold-storage, fssai-fsms-poultry]
    expected_answer_notes: >-
      FoodSafety.gov: fresh chicken, whole or pieces, 1 to 2 days refrigerated (frozen: 1 year whole,
      9 months pieces). FSSAI poultry: carcasses chilled below 4 °C within 4 hours; refrigerators at 4 °C;
      clean and dirty sections separated. Separate sections.
    verified: true
    gold_chunk_ids:
      - foodsafety-cold-storage:cold-food-storage-chart:3
      - fssai-fsms-poultry:3-8-carcass-chilling:1
      - fssai-fsms-poultry:3-9-post-slaughter-requirements:1  # added 4.9: hygienic handling, cold chain

  - id: cd-03
    question: How much salt is it OK to eat in a day, according to the guidelines?
    category: cross_doc
    expected_status: answered
    expected_doc_ids: [icmr-nin-dgi-2024, who-healthy-diet]
    expected_answer_notes: >-
      Both say about 5 g, but each must be stated separately: ICMR-NIN Guideline 11 says not more than
      5 g of salt (about 1 teaspoon, ~2 g sodium) per day (p. 90–91); WHO says less than 5 g of salt
      (2 g sodium) per day for adults. Must not be merged into one "the guidelines say" claim.
    verified: true
    gold_chunk_ids:
      - icmr-nin-dgi-2024:are-other-varieties-of-salt-any-better:2
      - icmr-nin-dgi-2024:high-bp-leads-to:1
      - who-healthy-diet:salt-sodium-and-potassium:2

  - id: cd-04
    question: What do the guidelines say about limiting sugar?
    category: cross_doc
    expected_status: answered
    expected_doc_ids: [icmr-nin-dgi-2024, who-healthy-diet]
    expected_answer_notes: >-
      ICMR-NIN: sugar less than 5% of total energy for adults (about 20–25 g a day), no added sugar for
      children under 2, avoid foods and beverages with added sugars (p. 19, 29). WHO: free sugars below
      10% of energy, with further benefit at 5% or less. Separate sections.
    verified: true
    gold_chunk_ids:
      - icmr-nin-dgi-2024:vitamins-and-minerals:13
      - who-healthy-diet:sugars:1

  - id: cd-05
    question: How should fresh fruits and vegetables be cleaned to keep them safe to eat?
    category: cross_doc
    holdout: true
    expected_status: answered
    expected_doc_ids: [icmr-nin-dgi-2024, fssai-fsms-fruits-vegetables]
    expected_answer_notes: >-
      ICMR-NIN: wash vegetables and fruits thoroughly before use, but not after cutting or peeling, and do
      not soak cut vegetables (p. 97, 105). FSSAI: wash with potable water to remove soil and
      contamination (p. 37). Separate sections.
    verified: true
    gold_chunk_ids:
      - icmr-nin-dgi-2024:granite-stone-cookware:2
      - fssai-fsms-fruits-vegetables:2-4-hygiene-control-in-specific-process-steps:1

