# Corpus registry — source documents and their provenance (ARCHITECTURE.md §3).
#
# Edit by hand to add or change documents. `retrieval_date` and `sha256` are
# written by the fetcher (`python -m guidance_rag.ingest fetch`), which rewrites
# this file, so put explanations in `notes` rather than in YAML comments.

documents:
- doc_id: icmr-nin-dgi-2024
  title: Dietary Guidelines for Indians
  short_name: ICMR-NIN DGI 2024
  publisher: ICMR – National Institute of Nutrition
  year: 2024
  source_url: https://nin.res.in/dietaryguidelines/pdfjs/locale/DGI_2024.pdf
  format: pdf
  domain: nutrition
  status: included
  aliases:
  - ICMR
  - NIN
  - ICMR-NIN
  - DGI
  - DGI 2024
  - Dietary Guidelines for Indians
  - Indian dietary guidelines
  - Indian guidelines
  title_text: Dietary Guidelines for Indians
  retrieval_method: direct
  notes: Revised Edition 2024 (earlier editions 1998 and 2011). The source URL serves the PDF directly
    despite the pdfjs path. Pages 7, 11, 13 and 17 are blank (no text layer); nothing to OCR.
  parser:
    skip_pages: [1-13, 17, 34, 56-58, 82, 120-121, 136-141, 147-148]
    headings:
    - {level: 1, min_size: 30, bold: true}
    - {level: 1, min_size: 24.5, max_size: 25.5, bold: true}
    - {level: 1, min_size: 14, bold: false, pattern: '^ANNEXURE\b'}
    - {level: 2, min_size: 12, bold: true, pattern: '^[A-Z]'}
    heading_exclude_regex: '^(Fig(ure)?|Table)\b'
    recommendation_regex: '^(RATIONALE|POINTS TO REGISTER)\b'
    max_body_font_size: 14.5
    drop_pull_quotes: true
    drop_tables: [p33-t1, p36-t1, p47-t1, p84-t1, p101-t1]
    notes: 'Skipped: cover, committee, contents, message and foreword (1-13); blank page 17; personalised
      meal-plan charts with calorie and body-weight targets (34, 56-58, 82, 120-121, 136-141), which are out
      of scope for this assistant; back matter (147-148). Two columns; pull quotes repeat the body text and
      are dropped. Each guideline''s RATIONALE and POINTS TO REGISTER boxes are recommendation blocks. Tables dropped because they are not real tables: p33-t1 (food-group infographic), p36-t1 (two-column iron/folate text box, read as interleaved text), p47-t1 (weekly infant menu with one cell copied across every row), p84-t1 and p101-t1 (figure frames).'
  retrieval_date: '2026-10-04'
  sha256: fc4bb5b1ee92a4d3d5dfe5d88eba15be6a50c096b709ce55d2bd4af1a1b91658
